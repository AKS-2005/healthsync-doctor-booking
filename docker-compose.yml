services:
  # 1. PostgreSQL Relational Database (ACID consistency, permanent data)
  postgres:
    image: postgres:15-alpine
    container_name: healthsync_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: doctor_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
    networks:
      - healthsync_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctor_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Store (Slot Locks, Caching, Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: healthsync_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthsync_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthsync_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/doctor_booking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-doctor-appointment-key-2026-jwt-token
      JWT_EXPIRES_IN: 7d
      SLOT_LOCK_TTL: 300
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - healthsync_net

  # 4. React + Vite Frontend (Nginx Production Serve)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthsync_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - healthsync_net

volumes:
  postgres_data:
  redis_data:

networks:
  healthsync_net:
    driver: bridge
